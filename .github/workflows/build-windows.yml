name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.2
          arch: win64_msvc2019_64
          cache: true

      - name: Unduh FFmpeg (shared)
        shell: pwsh
        run: |
          curl.exe -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DFFMPEG_ROOT="$env:FFMPEG_ROOT"
          cmake --build build --config Release

      - name: Paketkan
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/CCTVMonitor | Out-Null
          Copy-Item build/Release/CCTVMonitor.exe dist/CCTVMonitor/
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" dist/CCTVMonitor/
          Copy-Item cameras.json dist/CCTVMonitor/
          windeployqt --release --no-translations dist/CCTVMonitor/CCTVMonitor.exe
          Compress-Archive dist/CCTVMonitor dist/CCTVMonitor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CCTVMonitor-windows
          path: dist/CCTVMonitor-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CCTVMonitor-windows.zip

      - name: Release terbaru (zip lengkap)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build terbaru
          files: dist/CCTVMonitor-windows.zip

      - name: Publikasikan exe terbaru ke branch latest-exe
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pub | Out-Null
          Copy-Item dist/CCTVMonitor/CCTVMonitor.exe pub/
          Set-Location pub
          git init -q -b latest-exe
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CCTVMonitor.exe
          git commit -q -m "Build $env:GITHUB_SHA"
          git push -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" latest-exe
        env:
          GH_TOKEN: ${{ github.token }}
